# SS_WHO and SS_STACK are left out, a and shared replace them first
super: shared
property:
  who: b
  deep: b
  only_b: b
  stack: b.${stack}
  mkn.bin.key: ${mkn.bin.key};ss
env:
  - name: SS_WHO
    mode: replace
    value: b
  - name: SS_B
    mode: replace
    value: b
  - SS_B=$SS_B.${SS_B}.$SS_B
  - SS_STACK=b:$SS_STACK
